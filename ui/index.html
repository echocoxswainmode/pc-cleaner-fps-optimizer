<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tidy</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-overview" viewBox="0 0 18 18"><rect x="2.5" y="2.5" width="5.5" height="5.5" rx="1.5"/><rect x="10" y="2.5" width="5.5" height="5.5" rx="1.5"/><rect x="2.5" y="10" width="5.5" height="5.5" rx="1.5"/><rect x="10" y="10" width="5.5" height="5.5" rx="1.5"/></symbol>
    <symbol id="i-memory" viewBox="0 0 18 18"><rect x="2.5" y="5" width="13" height="8" rx="1.5"/><path d="M5.5 8v2M8 8v2M10.5 8v2M13 8v2M4.5 13v2M13.5 13v2M4.5 3v2M13.5 3v2"/></symbol>
    <symbol id="i-storage" viewBox="0 0 18 18"><rect x="2.5" y="4" width="13" height="10" rx="2"/><path d="M2.5 10.5h13M5.5 12.25h.01M8 12.25h.01"/></symbol>
    <symbol id="i-processes" viewBox="0 0 18 18"><path d="M2 9.5h3l2-5 4 9 2-4h3"/></symbol>
    <symbol id="i-startup" viewBox="0 0 18 18"><path d="M9 2.5v6"/><path d="M5.2 5a5.5 5.5 0 1 0 7.6 0"/></symbol>
    <symbol id="i-cleanup" viewBox="0 0 18 18"><path d="M13.5 2.5 9.8 8.2"/><path d="M7.4 7.6c1.6-.4 3.6.8 4 2.4L10 15.5H3.5c1-1.4 1.5-3 1.6-4.6.1-1.6 1-2.9 2.3-3.3z"/><path d="M6.2 15.5c.6-.9 1-2 1.1-3"/></symbol>
    <symbol id="i-scan" viewBox="0 0 18 18"><path d="M15 9a6 6 0 1 1-1.8-4.3"/><path d="M15 3v3h-3"/></symbol>
    <symbol id="i-search" viewBox="0 0 18 18"><circle cx="8" cy="8" r="4.75"/><path d="m11.5 11.5 3.5 3.5"/></symbol>
    <symbol id="i-check" viewBox="0 0 18 18"><path d="m4 9.5 3.2 3L14 5.5"/></symbol>
    <symbol id="i-shield" viewBox="0 0 18 18"><path d="M9 2.5 3.5 4.5v4.2c0 3.2 2.3 5.8 5.5 6.8 3.2-1 5.5-3.6 5.5-6.8V4.5z"/><path d="m6.6 9 1.7 1.7 3.2-3.4"/></symbol>
    <symbol id="i-chev" viewBox="0 0 18 18"><path d="m7 4.5 4.5 4.5L7 13.5"/></symbol>
    <symbol id="i-info" viewBox="0 0 18 18"><circle cx="9" cy="9" r="6.5"/><path d="M9 8.25v4M9 5.75h.01"/></symbol>
    <symbol id="i-file" viewBox="0 0 18 18"><path d="M10.5 2.5H5a1.5 1.5 0 0 0-1.5 1.5v10A1.5 1.5 0 0 0 5 15.5h8a1.5 1.5 0 0 0 1.5-1.5V6.5z"/><path d="M10.5 2.5v4h4"/></symbol>
    <symbol id="i-copy" viewBox="0 0 18 18"><rect x="6" y="6" width="9" height="9" rx="1.5"/><path d="M12 6V4.5A1.5 1.5 0 0 0 10.5 3h-6A1.5 1.5 0 0 0 3 4.5v6A1.5 1.5 0 0 0 4.5 12H6"/></symbol>
    <symbol id="i-min" viewBox="0 0 10 10"><path d="M0 5h10"/></symbol>
    <symbol id="i-max" viewBox="0 0 10 10"><rect x=".5" y=".5" width="9" height="9" rx="1"/></symbol>
    <symbol id="i-close" viewBox="0 0 10 10"><path d="m.5.5 9 9M9.5.5l-9 9"/></symbol>
    <symbol id="logo" viewBox="0 0 64 64"><defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4CD964"/><stop offset="1" stop-color="#28A745"/></linearGradient></defs><rect width="64" height="64" rx="15" fill="url(#lg)"/><circle cx="32" cy="32" r="17" fill="none" stroke="#fff" stroke-opacity=".32" stroke-width="5.5"/><path d="M32 15a17 17 0 1 1-16.2 22.2" fill="none" stroke="#fff" stroke-width="5.5" stroke-linecap="round"/><path d="m24.5 32.5 5.3 5.2 9.8-10.4" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </defs>
</svg>

<div class="win" id="win">
  <aside class="side">
    <div class="side-head" data-tauri-drag-region>
      <svg class="logo" width="20" height="20"><use href="#logo"/></svg><b>Tidy</b>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="pc"><span class="dot ok"></span><div><b id="pc-name">DESKTOP-7QK2M4R</b><small id="pc-os">Windows 11 Pro 24H2</small></div></div>
      <div class="side-meta"><span>Up <b id="pc-up">3 d 4 h</b></span><span>CPU <b id="pc-cpu">23%</b></span></div>
    </div>
  </aside>
  <main class="main">
    <header class="titlebar" data-tauri-drag-region>
      <div class="caps">
        <button class="cap" data-win="minimize" aria-label="Minimize"><svg><use href="#i-min"/></svg></button>
        <button class="cap" data-win="toggleMaximize" aria-label="Maximize"><svg><use href="#i-max"/></svg></button>
        <button class="cap close" data-win="close" aria-label="Close"><svg><use href="#i-close"/></svg></button>
      </div>
    </header>
    <section class="view" id="view"></section>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
